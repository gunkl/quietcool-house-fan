####################################################################################################
# Per-device settings (Issue #7): every value YOU need to change lives here, in one place. If your
# ESPHome dashboard file pulls this in via `packages:` (see README "Quickstart"), put your real
# values in a `substitutions:` block in YOUR file instead of editing this one -- your overrides win,
# and pulling a future update of this file (a new git ref, or just recompiling against `@main`)
# never touches your customization again. If you're using the older "paste the whole file in"
# approach instead, these are still the only lines you need to edit -- just do it here rather than
# hunting through the fields below, which no longer hold literal values.
####################################################################################################
substitutions:
  # Your remote's ID, one byte per key (see the comment further down for how to read this from the
  # logs). Defaults below are just this repo's own placeholder/example values.
  remote_id_0: "0xcb"
  remote_id_1: "0x00"
  remote_id_2: "0xd5"
  remote_id_3: "0x12"
  # Set to "true" to have the ESP learn its paired remote's ID from the next button press instead
  # of using the four values above. See the comment further down for details.
  autoset_remote_default: "false"
  # CC1101 wiring -- change to match how you wired your ESP32 to the CC1101 chip.
  cc1101_clk_pin: "18"
  cc1101_mosi_pin: "6"
  cc1101_miso_pin: "16"
  cc1101_cs_pin: "4"
  cc1101_gdo0_pin: "3"
  # CC1101 chips aren't perfectly centered out of the box -- if pairing/receiving doesn't work,
  # try nudging this 0.01MHz at a time. 433.96MHz has worked for at least one other user.
  cc1101_frequency: "433.92MHz"
  # Speed the fan runs at when it's turned on WITHOUT a speed being chosen (Issue #9) -- e.g. a
  # plain on/off toggle, or an automation calling fan.turn_on with no percentage. "1" = LOW,
  # "2" = HIGH. Choosing a speed explicitly (e.g. picking HIGH in the HA fan card) always wins
  # over this default. "1" (LOW) preserves this component's behavior from before this setting.
  fan_default_speed: "1"
  # Which QuietCool remote your fan is paired with. It picks the set of RF codes below:
  #   "glass"  (default) -- the touch-glass remote this component was built and tested on.
  #   "legacy" -- an older remote/fan (gunkl/quietcool-house-fan#14): the fan turns on at a
  #               speed with ONE byte, and it reports "off at LOW" as 0x90 with no 0x80.
  # Any other value fails the build.
  remote_type: "glass"
  # RF codes, one set per remote_type; only the set matching remote_type is used. To test or
  # troubleshoot, override any single code in YOUR substitutions, e.g.  glass_code_speed_low: "0x1f"
  #   *_code_turn_on_low/high    byte that starts the fan at LOW / HIGH
  #   *_turn_on_sends_speed      "true": a speed-select byte follows the turn-on byte (glass: 0xBF
  #                              starts the fan at HIGH, then 0x1F/0x3F sets the speed)
  #   *_code_off                 turn off
  #   *_code_speed_low/high      change speed while running
  #   *_codes_timer_low/high     timer at LOW / HIGH speed, in the order 1h, 2h, 4h, 8h, 12h
  #   *_code_off_status_low      "off" status the remote reports at LOW ("0x00" = none; such a
  #                              remote reports off as 0x80/0xB0 at any speed)
  glass_code_turn_on_low: "0xbf"
  glass_code_turn_on_high: "0xbf"
  glass_turn_on_sends_speed: "true"
  glass_code_off: "0x80"
  glass_code_speed_low: "0x1f"
  glass_code_speed_high: "0x3f"
  glass_codes_timer_low: "0x91, 0x92, 0x94, 0x98, 0x9c"
  glass_codes_timer_high: "0xb1, 0xb2, 0xb4, 0xb8, 0xbc"
  glass_code_off_status_low: "0x00"
  legacy_code_turn_on_low: "0x9f"
  legacy_code_turn_on_high: "0xbf"
  legacy_turn_on_sends_speed: "false"
  legacy_code_off: "0x80"
  legacy_code_speed_low: "0x1f"
  legacy_code_speed_high: "0x3f"
  legacy_codes_timer_low: "0x91, 0x92, 0x94, 0x98, 0x9c"
  legacy_codes_timer_high: "0xb1, 0xb2, 0xb4, 0xb8, 0xbc"
  legacy_code_off_status_low: "0x90"
  # Tuning for the OPTIONAL power-entity package (power-entity.yaml, see README); harmless defaults
  # otherwise. The power reading lags a real change. Measured (gunkl/ClimateAdvisor#1215 production
  # logs): ON up to 14.0 s after a remote timer press (9.4 s on another; an earlier ~5.5 s figure was
  # a still-spinning fan restarting, not a cold start), OFF ~15.5 s. Defaults add margin to the worst
  # case: 20 s (14.0 + ~40%) for on, 25 s for off. Inside this window after a remote press or a
  # transmission from this device the entity follows that event and the reading may not override it.
  power_on_lag_s: "20"
  power_off_lag_s: "25"
  # Hard timeout: after the lag window the reading only overrides the entity once it has CHANGED since
  # the event (so a slow spin-up, still reading "off", never flips an entity the user just turned
  # on). If it has not changed at all by this long after the event, it wins anyway.
  power_hard_timeout_s: "90"

####################################################################################################
# Boot guard (Issue #1): prevents this ESP from TRANSMITTING to the physical fan on boot.
#
# The `fan:` template platform below has restore_mode: RESTORE_DEFAULT_OFF, which restores the
# LAST KNOWN state on boot (defaulting to off only if nothing was ever persisted). Template
# platforms have no independent way to reflect a restored state except by replaying their
# configured action triggers (on_turn_on/on_speed_set) during setup() -- which, in this
# component, includes a REAL RF transmission via send_command. Without a guard, a routine reboot
# (firmware update, power blip) would silently re-command the physical fan to whatever HA last
# recorded, with no user action at all. `booted_up` gates only the transmit step (see the fan:
# section below) -- the entity's reported state still updates locally either way, so HA shows the
# correct restored value; it just doesn't retransmit to force the physical fan to match.
####################################################################################################
esphome:
  on_boot:
    priority: -100    # after other components have finished their own setup/restore
    then:
      - lambda: |-
          static_assert(${fan_default_speed} >= 1 && ${fan_default_speed} <= 2,
                        "fan_default_speed must be 1 (LOW) or 2 (HIGH)");
          static_assert(std::string_view("${remote_type}") == "glass" ||
                        std::string_view("${remote_type}") == "legacy",
                        "remote_type must be \"glass\" or \"legacy\"");
          static_assert((${glass_code_turn_on_low}) >= 0 && (${glass_code_turn_on_low}) <= 0xFF &&
                        (${glass_code_turn_on_high}) >= 0 && (${glass_code_turn_on_high}) <= 0xFF &&
                        (${glass_code_off}) >= 0 && (${glass_code_off}) <= 0xFF &&
                        (${glass_code_speed_low}) >= 0 && (${glass_code_speed_low}) <= 0xFF &&
                        (${glass_code_speed_high}) >= 0 && (${glass_code_speed_high}) <= 0xFF &&
                        (${glass_code_off_status_low}) >= 0 && (${glass_code_off_status_low}) <= 0xFF &&
                        (${legacy_code_turn_on_low}) >= 0 && (${legacy_code_turn_on_low}) <= 0xFF &&
                        (${legacy_code_turn_on_high}) >= 0 && (${legacy_code_turn_on_high}) <= 0xFF &&
                        (${legacy_code_off}) >= 0 && (${legacy_code_off}) <= 0xFF &&
                        (${legacy_code_speed_low}) >= 0 && (${legacy_code_speed_low}) <= 0xFF &&
                        (${legacy_code_speed_high}) >= 0 && (${legacy_code_speed_high}) <= 0xFF &&
                        (${legacy_code_off_status_low}) >= 0 && (${legacy_code_off_status_low}) <= 0xFF,
                        "every *_code_* substitution must be one byte (0x00-0xFF)");
          // Issue #9/#10: while OFF, the fan entity's speed field holds fan_default_speed (see
          // on_turn_off below). Re-apply it here, right after restore, so the next plain turn-on
          // uses the configured default. This covers a fresh install, a device upgraded from an
          // older version (which persisted speed=0 while off), and one whose fan_default_speed
          // was just changed. Not published: nothing transmits. HA picks the value up on its next
          // state sync (an already-connected HA may show 0% until then, which is cosmetic only).
          if (!id(house_fan).state) {
            id(house_fan).speed = ${fan_default_speed};
          }
      - delay: 2s      # comfortably longer than template-entity restore/apply takes
      - lambda: 'id(booted_up) = true;'
      # The timer preset lives in RAM only: drop any timer restored from flash (see fan: presets).
      - script.execute: refresh_timer_preset
      - script.execute: reconcile_loop

globals:
  # -- RF codes for the selected remote_type (see substitutions). Set once at build time. --------
  - id: remote_is_legacy
    type: bool
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy")'
  - id: code_turn_on_low
    type: uint8_t
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_code_turn_on_low}) : (${glass_code_turn_on_low})'
  - id: code_turn_on_high
    type: uint8_t
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_code_turn_on_high}) : (${glass_code_turn_on_high})'
  - id: turn_on_sends_speed
    type: bool
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_turn_on_sends_speed}) : (${glass_turn_on_sends_speed})'
  - id: code_off
    type: uint8_t
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_code_off}) : (${glass_code_off})'
  - id: code_speed_low
    type: uint8_t
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_code_speed_low}) : (${glass_code_speed_low})'
  - id: code_speed_high
    type: uint8_t
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_code_speed_high}) : (${glass_code_speed_high})'
  - id: codes_timer_low     # 1h, 2h, 4h, 8h, 12h
    type: std::array<uint8_t, 5>
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? std::array<uint8_t, 5>{${legacy_codes_timer_low}} : std::array<uint8_t, 5>{${glass_codes_timer_low}}'
  - id: codes_timer_high    # 1h, 2h, 4h, 8h, 12h
    type: std::array<uint8_t, 5>
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? std::array<uint8_t, 5>{${legacy_codes_timer_high}} : std::array<uint8_t, 5>{${glass_codes_timer_high}}'
  - id: code_off_status_low # 0 = this remote has no separate off-at-LOW status byte
    type: uint8_t
    restore_value: false
    initial_value: '(std::string_view("${remote_type}") == "legacy") ? (${legacy_code_off_status_low}) : (${glass_code_off_status_low})'

  # -- Timer from Home Assistant (fan presets) ---------------------------------------------------
  # The FAN runs the timer; this device only sends it. A timer picked while the fan is off is held
  # (pending_ha_timer_*) for HA_TIMER_HOLD_MS, and sent right after the next turn-on from HA.
  # timer_preset_hours is what the fan entity's preset shows (0 = "No timer"); RAM only.
  - id: pending_ha_timer_hours
    type: int
    restore_value: false
    initial_value: '0'
  - id: pending_ha_timer_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: timer_preset_hours
    type: int
    restore_value: false
    initial_value: '0'

  - id: booted_up
    type: bool
    restore_value: false
    initial_value: 'false'

  # Your remote's ID -- see the `substitutions:` block at the top of this file. If you don't know
  # your ID, open up the ESPHome logger and push any button on your remote (if you just wake up
  # your remote it should send the command "0x66", the wakeup command). In the logs you'll see:
  #
  # [15:59:14.560][D][quietcool-fan:060]: Remote command received: 0x66
  # [15:59:14.560][D][quietcool-fan:061]:          from remote ID: [0xcb, 0x00, 0xa0, 0xcf]
  #
  # Set remote_id_0..3 (in the substitutions block) to those four values.
  #
  # Note that you should be able to put your fan in pairing mode and then tell ESPHome to turn
  # it on which should make it learn whatever default code is here. You should be able to but
  # I haven't tested it because my fan is hard to get to.
  - id: remote_id
    type: 'uint8_t[4]'
    restore_value: true
    initial_value: '{${remote_id_0}, ${remote_id_1}, ${remote_id_2}, ${remote_id_3}}'

  # If you can't view the logs or don't want to, you can have this module learn the remote ID when
  # it starts up. Set autoset_remote_default to "true" (in the substitutions block) and shortly
  # after your ESP boots, press a button on your remote (or just wake it). The ESP will then retain
  # that ID as long as it has power (it should try to retain it after a power outage, but it's not
  # a guarantee and I'm not sure what will happen during software updates).
  - id: autoset_remote
    type: bool
    restore_value: true
    initial_value: '${autoset_remote_default}'

  # -- Remote-receive support (Issue #1) -----------------------------------------------------
  # Tracks the last command WE transmitted (via the send_command script below) and when, so a
  # received packet that merely echoes our own transmission is not misread as a remote button
  # press. See the on_packet handler and docs/remote-capture-protocol.md.
  - id: last_sent_command
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: last_sent_command_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # True only while sync_fan_from_remote (script section below) is publishing a REMOTE-observed
  # power/speed change onto house_fan. The fan's on_turn_on/on_turn_off/on_speed_set triggers fire
  # from ESPHome's state callback and cannot be bypassed, so every RF transmit in them is gated on
  # this being false -- otherwise mirroring the remote would transmit it straight back (gunkl/ClimateAdvisor#1215).
  - id: syncing_from_remote
    type: bool
    restore_value: false
    initial_value: 'false'

  # -- "Any byte that implies ON" support (gunkl/ClimateAdvisor#1215) -------------------------------------------
  # The remote has no dedicated power-on press: 0xBF is just "timer=none, speed=high", and a
  # power-up "does not reliably re-transmit" anything (docs/remote-capture-protocol.md, "Interpretation
  # rule for consumers"). So house_fan mirrors "on" from ANY confirmed speed/timer/0xBF byte, and
  # "off" only from a confirmed 0x80/0xB0. The globals below keep a post-off status beacon from
  # flipping the entity back on: an UNCHANGED (already-held) byte only counts as a power-on when it
  # belongs to a fresh interaction (see remote_hint in the script section).
  #   last_remote_rx_ms  when we last heard ANY packet from our remote (0 = never)
  #   fresh_ms           when the current fresh interaction began (a 0x66 wake, or the first packet
  #                      after a quiet gap); 0 = none. Cleared by a confirmed off.
  #   implied_on_*       2-reading confirmation for an unchanged-but-fresh implied-on byte
  - id: last_remote_rx_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: fresh_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: implied_on_count
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: implied_on_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: implied_off_count
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: implied_off_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # -- Two separate states (gunkl/ClimateAdvisor#1215) -------------------------------------------------------------
  # (a) What the REMOTE last announced, per field: power_state / speed_state / timer_state above.
  #     They change ONLY when remote packets confirm a new value; this device's own transmissions
  #     never touch them. The physical remote never hears us, so after CA starts the fan the remote
  #     still believes whatever it last said -- overwriting these with CA's commands made the remote's
  #     next plain wake (re-sending that stale value) look like a brand-new press.
  # (b) The fan's actual state: the house_fan entity.
  # A remote message changes (b) only when it changes (a), i.e. a real press. remote_power is (a)'s
  # power view including what speed/timer bytes imply (0 unknown, 1 on, 2 off); it exists because
  # power_state alone must stay exactly as it was for the HA events.
  # Persisted across reboots: after an ESP restart the remote still holds whatever it last said, so
  # its next plain wake must not look like a press (a stale status re-sent after a reboot, e.g. a
  # stale "on" speed after CA stopped the fan). The held per-field values above are NOT persisted
  # (they feed the HA events exactly as before); for the ENTITY only, the first confirmation of a
  # field after boot (previous value 0) is treated as "unchanged" -- see remote_hint.
  - id: remote_power
    type: uint8_t
    restore_value: true
    initial_value: '0'
  # Set true at runtime by the optional power-entity package (power-entity.yaml).
  # True = a power reading is the source of truth, so the timer countdown fallback is not used.
  - id: power_entity_present
    type: bool
    restore_value: false
    initial_value: 'false'

  # The latest remote press or local transmission that moved the entity, and which way. Inside the
  # power_*_lag_s window after it, the entity follows it and the power reading cannot override it.
  - id: last_event_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_event_on
    type: bool
    restore_value: false
    initial_value: 'false'

  # Power reading imported from HA (power-entity.yaml): 0 = none/unavailable/unknown, 1 = on, 2 = off,
  # plus when it last changed (a change must hold ~2 s before it is trusted).
  - id: power_reading
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: power_reading_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Last REAL (on/off) reading, kept across "unavailable" so power_reading_ms only moves on a true change.
  - id: power_reading_last
    type: uint8_t
    restore_value: false
    initial_value: '0'

  # Timer countdown fallback (only with NO power-entity package): a remote timer that runs out transmits
  # nothing, so without a power reading the entity would read "on" forever.
  - id: timer_armed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: timer_deadline_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Every byte this device transmitted in the last few seconds (ring buffer, newest overwrites
  # oldest). A received packet equal to ANY of them within SELF_ECHO_WINDOW_MS is our own echo and is
  # dropped before decode. Our sends are multi-byte (0xBF then a speed byte), so remembering only the
  # last byte let echoes of the earlier ones through and change the remote's held state (a).
  - id: sent_cmds
    type: 'uint8_t[8]'
    restore_value: false
    initial_value: '{0, 0, 0, 0, 0, 0, 0, 0}'
  - id: sent_cmds_ms
    type: 'uint32_t[8]'
    restore_value: false
    initial_value: '{0, 0, 0, 0, 0, 0, 0, 0}'
  - id: sent_cmds_idx
    type: uint8_t
    restore_value: false
    initial_value: '0'

  # Speed level (1=LOW, 2=HIGH) we last TRANSMITTED since the fan was last turned on; 0 = none
  # since the last turn-off/boot. Lets on_speed_set skip re-sending a speed byte that on_turn_on
  # already sent in the same state update (Issue #10). See the fan: section below.
  - id: commanded_speed
    type: int
    restore_value: false
    initial_value: '0'

  # -- Field state (Issue #1) -----------------------------------------------------------------
  # The remote is a periodic-status BEACON, not a burst-per-press transmitter: after any single
  # interaction it re-broadcasts its full current status (power, speed, and timer, in rotation)
  # for several seconds, so the same byte can legitimately repeat many times a second or so
  # apart even though the user pressed nothing new. A received byte is therefore a *reported
  # value* for one of these three independent fields, not itself an event.
  #
  # Each global below holds the last-ACCEPTED (held) value for one field, as its raw command
  # byte -- the byte already fully identifies the value within its field (the power/speed/timer
  # byte-spaces are disjoint), so no separate enum/translation layer is needed. An HA event
  # fires only when a newly-decoded field's reported value differs from its held value (an
  # edge/transition); a heartbeat re-announcing an unchanged value is silently absorbed no
  # matter how long it repeats. See the on_packet handler below and
  # docs/remote-capture-protocol.md. `0x00` is a safe "never observed" sentinel for all three --
  # no real byte in any of the three families is `0x00`.
  - id: power_state
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: speed_state
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: timer_state
    type: uint8_t
    restore_value: false
    initial_value: '0'

  # -- Pending-candidate confirmation (Issue #1) -----------------------------------------------
  # A single received packet is not reliable enough to act on: the receiver occasionally decodes
  # garbage with the CORRECT remote ID but a corrupted command byte, which can coincidentally
  # land on a byte that's a real, valid value for a field -- purely because of which bit flipped
  # (a single-bit-corrupted Speed=High transmission can misread as a genuine-looking Power=On
  # byte, for example). A real transmission always repeats (the protocol's own convention is 3x
  # per value), so a value must be seen TWICE, matching, within CONFIRM_WINDOW_MS, before it's
  # trusted enough to update the held state / fire an HA event. One per field, independent of
  # the others. See the on_packet handler below and docs/remote-capture-protocol.md.
  - id: pending_power_value
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: pending_power_count
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: pending_power_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: pending_speed_value
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: pending_speed_count
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: pending_speed_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: pending_timer_value
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: pending_timer_count
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: pending_timer_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

####################################################################################################
# ESP32-to-CC1101 wiring and radio frequency -- see the `substitutions:` block at the top of this
# file to change these for your hardware (cc1101_clk_pin/cc1101_mosi_pin/cc1101_miso_pin/
# cc1101_cs_pin/cc1101_gdo0_pin/cc1101_frequency). If pairing/receiving doesn't work out of the
# box, nudging cc1101_frequency 0.01MHz at a time is the most common fix -- CC1101 chips aren't
# perfectly centered from the factory. 433.96MHz has worked for at least one other user.
####################################################################################################
spi:
  clk_pin: ${cc1101_clk_pin}
  mosi_pin: ${cc1101_mosi_pin}
  miso_pin: ${cc1101_miso_pin}

cc1101:
  cs_pin: ${cc1101_cs_pin}
  gdo0_pin: ${cc1101_gdo0_pin}
  frequency: ${cc1101_frequency}

####################################################################################################
# You shouldn't need to change anything below this line. See the README if you want details
# on how the protocol works.
####################################################################################################
  modulation_type: 2-FSK
  symbol_rate: 2400
  fsk_deviation: 10kHz
  packet_mode: True
  packet_length: 0
  sync_mode: 16/16
  sync0: 0xd4
  sync1: 0x2d
  num_preamble: 4
  on_packet:
    then:
      - lambda: |-
          // ==== Remote-receive support (Issue #1) =========================================
          // ONTOLOGY -- read this before touching this handler:
          // The remote reports its status (power, speed, timer) only while transmitting after
          // an interaction. The ONLY guarantee is that a single genuine command is sent 3x in a
          // tight burst (~70-260ms apart, by the protocol's own convention). Sometimes multiple
          // fields' commands are seen together (e.g. speed + timer, 3x each), and sometimes the
          // whole sequence repeats a few times -- but that is an OBSERVED behavior, not a
          // guarantee to design around. Do not assume continuous/indefinite re-announcement, and
          // do not rely on "a later repeat will confirm it if this burst doesn't."
          //
          // A received byte is a *reported value* for one of the three fields, not itself a
          // press event. The only thing that should ever reach Home Assistant is a *change*: a
          // field's newly-reported value differing from what we last held for that field. Do NOT
          // reintroduce a time-window debounce against the HELD value -- a real repeat of an
          // already-confirmed value is indistinguishable from "a new press of the same value"
          // under any fixed time window; only comparing against the held per-field value gets
          // that right.
          //
          // A single reading is not enough to trust a NEW value, though: the receiver
          // occasionally decodes garbage with the CORRECT remote ID but a corrupted command
          // byte, which can coincidentally land on a byte that's a real, valid value -- either
          // for a different field entirely, or for a different value WITHIN the same field
          // (e.g. a bit-flipped High can misread as Medium). Since only 3x per genuine command is
          // guaranteed, a newly-differing value must be confirmed by a SECOND matching reading
          // before it updates the held state / fires an event -- see the pending_*_value/count/ms
          // globals above. A non-matching reading for a DIFFERENT field never interferes (routed
          // independently). A non-matching reading for the SAME field, arriving within
          // SAME_BURST_TOLERANCE_MS of the current candidate, is treated as a possible corrupted
          // copy of the SAME burst and is ignored outright (not overwritten) -- this is what
          // correctly reads a 3f,2f,3f sequence as "confirmed 3f, discard the 2f" rather than
          // resetting progress on the mismatch. Beyond that short tolerance, a differing
          // same-field reading is trusted as a genuinely new candidate and does overwrite. See
          // docs/remote-capture-protocol.md for the capture evidence behind these rules.

          static const uint32_t SELF_ECHO_WINDOW_MS = 2000;       // any byte we sent (sent_cmds ring), not just the last
          static const uint32_t SAME_BURST_TOLERANCE_MS = 400;    // covers the ~70-260ms intra-burst spacing, with margin
          static const uint32_t CONFIRM_WINDOW_MS = 1500;         // overall candidate lifetime before it's abandoned
          static const uint32_t NEW_BURST_GAP_MS = 3000;          // silence this long => next packet starts a new interaction
          static const uint8_t ID_FUZZY_MATCH_BITS = 2;           // tolerate this many differing bits across the 4 ID bytes

          uint32_t now_ms = millis();
          uint8_t cmd = x[4];

          // Fuzzy ID match (Issue #1): an exact-equality check rejected a genuine command byte
          // whose ID envelope suffered a 1-bit corruption while the command byte itself was
          // perfectly intact (observed live: a real Speed=Low reading arrived with ID
          // [cb,00,cc,26] instead of [cb,00,cc,27] -- 1 bit off -- and was discarded before ever
          // reaching the confirm logic below, leaving only one usable reading and no event
          // fired). Every catalogued NOISE packet in docs/remote-capture-protocol.md differs by
          // 5-6 bits; every near-miss ID seen alongside an otherwise-genuine command byte has
          // been 1 bit off. A tolerance of ID_FUZZY_MATCH_BITS=2 admits the real near-misses
          // while still rejecting every catalogued noise event by a wide margin.
          uint8_t id_diff_bits = 0;
          for (uint8_t i = 0; i < 4; i++) {
            uint8_t id_xor = x[i] ^ id(remote_id)[i];
            while (id_xor) {
              id_diff_bits += (id_xor & 1);
              id_xor >>= 1;
            }
          }
          bool id_match = (id_diff_bits <= ID_FUZZY_MATCH_BITS);

          // Known command bytes, for logging only (does not gate field decode below).
          const char *name = "UNKNOWN";
          if (cmd == 0x66) name = "KNOWN(wake)";
          else if (cmd == 0x80) name = "KNOWN(power=off, action)";
          else if (cmd == 0xb0) name = "KNOWN(power=off, status)";
          else if (cmd == 0x90) name = id(remote_is_legacy) ? "KNOWN(power=off, status, speed=low)" : "UNKNOWN(0x90: off-at-LOW on legacy remotes only)";
          else if (cmd == 0xbf) name = "KNOWN(power=on)";
          else if (cmd == 0x1f) name = "KNOWN(speed=low)";
          else if (cmd == 0x2f) name = "KNOWN(speed=medium, untested)";
          else if (cmd == 0x3f) name = "KNOWN(speed=high)";
          else if (cmd == 0x91) name = "KNOWN(timer=1h, speed=low)";
          else if (cmd == 0x92) name = "KNOWN(timer=2h, speed=low)";
          else if (cmd == 0x94) name = "KNOWN(timer=4h, speed=low)";
          else if (cmd == 0x98) name = "KNOWN(timer=8h, speed=low)";
          else if (cmd == 0x9c) name = "KNOWN(timer=12h, speed=low)";
          else if (cmd == 0x9f) name = "KNOWN(timer=none, speed=low)";
          else if (cmd == 0xa1) name = "KNOWN(timer=1h, speed=medium, speculative)";
          else if (cmd == 0xa2) name = "KNOWN(timer=2h, speed=medium, speculative)";
          else if (cmd == 0xa4) name = "KNOWN(timer=4h, speed=medium, speculative)";
          else if (cmd == 0xa8) name = "KNOWN(timer=8h, speed=medium, speculative)";
          else if (cmd == 0xac) name = "KNOWN(timer=12h, speed=medium, speculative)";
          else if (cmd == 0xaf) name = "KNOWN(timer=none, speed=medium, speculative)";
          else if (cmd == 0xb1) name = "KNOWN(timer=1h, speed=high)";
          else if (cmd == 0xb2) name = "KNOWN(timer=2h, speed=high)";
          else if (cmd == 0xb4) name = "KNOWN(timer=4h, speed=high)";
          else if (cmd == 0xb8) name = "KNOWN(timer=8h, speed=high)";
          else if (cmd == 0xbc) name = "KNOWN(timer=12h, speed=high)";

          ESP_LOGD("quietcool-fan", "Remote command received: 0x%02x [%s] id_match=%s (id_diff_bits=%u)",
                   cmd, name, id_match ? "yes" : "no", id_diff_bits);
          ESP_LOGD("quietcool-fan", "         from remote ID: [0x%02x, 0x%02x, 0x%02x, 0x%02x]",
                   x[0], x[1], x[2], x[3]);

          if (id(autoset_remote)) {
            memcpy(id(remote_id), x.data(), 4);
            id(autoset_remote) = false;
          }

          // ==== HA event decode (Issue #1, only for packets from our paired remote/fan) ====
          if (!id_match) return;

          // Self-echo guard: ignore a received packet that is just hearing our own transmit
          // (send_command below stamps last_sent_command/_ms right before sending). This is
          // UNRELATED to the field/heartbeat model above -- it only protects against hearing
          // our own just-sent command, never against the remote's own repeats.
          // Checks EVERY byte in the sent_cmds ring (a send is several bytes, e.g. 0xBF then a speed
          // byte): production showed a `low` event ~1 s after CA's 0xBF+0x1F -- an echo of the
          // earlier byte passed the old last-byte-only, 500 ms guard and changed speed_state
          // (gunkl/ClimateAdvisor#1215). Dropped here, so such self-echoes no longer fire HA events.
          for (uint8_t i = 0; i < 8; i++) {
            uint32_t sent_age_ms = now_ms - id(sent_cmds_ms)[i];
            if (id(sent_cmds_ms)[i] != 0 && cmd == id(sent_cmds)[i] && sent_age_ms < SELF_ECHO_WINDOW_MS) {
              ESP_LOGD("quietcool-fan", "Suppressed as self-echo (cmd 0x%02x sent %u ms ago)", cmd, (unsigned) sent_age_ms);
              return;
            }
          }

          // Fresh-interaction tracking (gunkl/ClimateAdvisor#1215). A 0x66 wake, or the first packet after a quiet
          // gap, marks the start of a new interaction; remote_hint uses it to tell a
          // genuine new press from the remote's post-off status beacon repeating old values.
          if (cmd == 0x66 || id(last_remote_rx_ms) == 0 || (now_ms - id(last_remote_rx_ms)) > NEW_BURST_GAP_MS) {
            id(fresh_ms) = now_ms;
          }
          id(last_remote_rx_ms) = now_ms;

          // ---- POWER field ------------------------------------------------------------------
          // 0x80 (fired once, as the action, right when Off is pressed) and 0xB0 (the ongoing
          // status re-announcement of the same fact -- seen on wake/heartbeat, not just right
          // after a press) both mean "off". Normalize to one canonical value so a 0xB0 arriving
          // moments after a 0x80 doesn't double-fire. There is no equivalent second byte for
          // On: On's status *is* whatever Speed is currently held, so it needs no separate
          // status byte of its own. See docs/remote-capture-protocol.md.
          // Legacy remotes (remote_type: legacy, gunkl/quietcool-house-fan#14) report "off" at LOW
          // as code_off_status_low (0x90) and send no 0x80 at all; decoded exactly like 0xB0. On the
          // glass remote code_off_status_low is 0 (none): off is 0x80/0xB0 at any speed (#5 capture).
          bool is_off_status_low = (id(code_off_status_low) != 0 && cmd == id(code_off_status_low));
          if (cmd == 0xbf || cmd == 0x80 || cmd == 0xb0 || is_off_status_low) {
            uint8_t normalized = (cmd == 0xbf) ? 0xbf : 0x80;
            // Legacy only: an off after the remote announced ON through a timer or speed byte is a
            // change even though power_state still holds the earlier off (those bytes never touch
            // power_state): off, timer_1h (0x91), off (0x90 only) -- the second off must not be
            // dropped. The glass remote always sends the 0x80 action byte, which remote_hint already
            // catches, so it keeps the original rule.
            bool off_after_implied_on = id(remote_is_legacy) && normalized == 0x80 && id(remote_power) == 1;
            if (normalized == id(power_state) && !off_after_implied_on) {
              // Unchanged vs what the remote already announced: not a press by itself (a plain wake
              // just repeats it). remote_hint decides whether it is a fresh re-press (gunkl/ClimateAdvisor#1215).
              id(remote_hint)->execute(normalized == 0xbf, normalized == 0xbf ? 2 : 0, false, cmd, -1);
              return;  // heartbeat re-confirming already-accepted state
            }
            uint32_t power_age_ms = now_ms - id(pending_power_ms);
            if (id(pending_power_count) > 0 && id(pending_power_value) == normalized &&
                power_age_ms <= CONFIRM_WINDOW_MS) {
              // Matches the in-progress candidate -- confirm.
              id(pending_power_count) += 1;
              if (id(pending_power_count) >= 2) {
                uint8_t prev_power = id(power_state);   // for remote_hint only; 0 = first confirmation since boot
                id(power_state) = normalized;
                std::string token = (normalized == 0xbf) ? "on" : "off";
                ESP_LOGI("quietcool-fan", "Power: CONFIRMED 0x%02x -> firing event '%s'", normalized, token.c_str());
                id(quietcool_remote_event).trigger(token);
                // ==== Ambient speed sensor (Issue: Climate Advisor speed-aware remote) ====
                // 0x80 (off, action) carries no speed-context bit -- skipped, as before.
                //
                // 0xb0 (off, status): a prior version of this branch extracted a speed_ctx from
                // this byte via the same 0x20-bit family mask used for TIMER, but that was an
                // unverified extrapolation -- and it was WRONG. Confirmed via a direct A/B capture
                // (gunkl/quietcool-house-fan#5, 2026-07-25): pressing OFF at LOW and pressing OFF
                // at HIGH both transmit the identical byte (0xb0), proving this byte carries no
                // speed information at all (matching what docs/remote-capture-protocol.md had
                // already concluded before that extraction was added: "off carries no meaningful
                // speed context of its own"). Deliberately not publishing anything here now -- the
                // ambient sensor simply keeps whatever real speed was last confirmed by the SPEED
                // field or the TIMER branch below, which stays correct across an off press instead
                // of being overwritten with a fabricated value.
                //
                // 0xbf (on): DOES reliably mean "high" -- but not because of a per-speed nibble
                // decode (the 0xb0 evidence above rules that out for this family). Confirmed via
                // the same #5 capture: pressing bare ON with no speed touched fires 0xbf and the
                // fan is physically HIGH, independent of whatever speed was held before the fan
                // was last turned off. This remote's power-on hardware default is hardcoded to
                // HIGH -- not a re-announcement of a held value. Kept because it's empirically
                // correct, with the real mechanism now documented instead of the old TIMER-family
                // extrapolation theory.
                if (normalized == 0xbf) {
                  id(quietcool_speed_sensor).publish_state("high");
                  ESP_LOGD("quietcool-fan", "Speed sensor updated from power branch: high (power-on default)");
                  // Also update the SHARED speed_state held-value (not just the ambient sensor) --
                  // otherwise it goes stale relative to reality and the TIMER branch's speed-edge
                  // check above (gunkl/quietcool-house-fan#5 follow-up) can wrongly treat a later
                  // genuine LOW selection as "no change" because speed_state never learned we're
                  // really at HIGH now. Found via log inspection, not yet independently hardware-
                  // confirmed the way the 0xB0/0xBF findings above were -- flagging that distinction
                  // explicitly rather than overstating confidence.
                  id(speed_state) = 0x3f;
                }
                // ==== Fan entity follows the remote's power (gunkl/ClimateAdvisor#1215, gunkl/ClimateAdvisor#449) ====================
                // A remote press never touched house_fan's state, so after a remote start HA's
                // entity still read "off" and a plain fan.turn_off was a no-op: ESPHome fires
                // on_turn_off (the only place 0x80 is transmitted) solely on an on->off edge. CA
                // worked around it with "on, wait, off" (gunkl/ClimateAdvisor#449), which looped against a lagging
                // power reading (gunkl/ClimateAdvisor#1215). Now a CONFIRMED remote power change (we are past the
                // 2-reading debounce here) is mirrored onto the entity -- no transmit -- so the
                // next HA turn_off/turn_on is a real edge. A remote start reads as HIGH (see above).
                // "Off" is only ever mirrored from here (0x80/0xB0). "On" is ALSO mirrored from any
                // confirmed speed/timer byte -- see remote_hint -- because 0xBF is not a
                // dedicated power-on press and often never arrives (e.g. off, then timer_1h).
                // The first confirmation after boot (prev_power == 0) is treated as unchanged for the
                // entity: a stale status re-sent after a reboot must not look like a press.
                id(timer_armed) = false;   // a power change supersedes any timer countdown
                if (normalized == 0xbf) {
                  id(remote_hint)->execute(true, 2, prev_power != 0, cmd, prev_power == 0 ? 0 : -1);
                } else {
                  id(remote_hint)->execute(false, 0, prev_power != 0 || off_after_implied_on, cmd, -1);
                  id(implied_off_count) = 0;
                  // The off burst and the status beacon trailing it must not look like a new
                  // interaction to remote_hint.
                  id(fresh_ms) = 0;
                  id(implied_on_count) = 0;
                }
                id(pending_power_count) = 0;
              }
            } else if (id(pending_power_count) > 0 && power_age_ms <= SAME_BURST_TOLERANCE_MS) {
              // Mismatch, but still inside the same 3x burst window -- likely a corrupted copy
              // of the candidate we're already tracking. Ignore it; do not lose progress.
              ESP_LOGD("quietcool-fan", "Power: ignoring mismatched 0x%02x within same-burst tolerance", cmd);
            } else {
              // No candidate, or the mismatch is late enough to be a genuinely new value.
              ESP_LOGD("quietcool-fan", "Power: new candidate 0x%02x, awaiting confirmation", normalized);
              id(pending_power_value) = normalized;
              id(pending_power_count) = 1;
              id(pending_power_ms) = now_ms;
            }
            return;
          }

          // ---- SPEED field ------------------------------------------------------------------
          if (cmd == 0x1f || cmd == 0x2f || cmd == 0x3f) {
            if (cmd == id(speed_state)) {
              id(remote_hint)->execute(true, (cmd == 0x1f) ? 1 : 2, false, cmd, -1);
              return;  // heartbeat re-confirming already-accepted state
            }
            uint32_t speed_age_ms = now_ms - id(pending_speed_ms);
            if (id(pending_speed_count) > 0 && id(pending_speed_value) == cmd &&
                speed_age_ms <= CONFIRM_WINDOW_MS) {
              // Matches the in-progress candidate -- confirm.
              id(pending_speed_count) += 1;
              if (id(pending_speed_count) >= 2) {
                uint8_t prev_speed = id(speed_state);   // 0 = first confirmation since boot
                id(speed_state) = cmd;
                std::string token = (cmd == 0x1f) ? "low" : (cmd == 0x2f) ? "medium" : "high";
                ESP_LOGI("quietcool-fan", "Speed: CONFIRMED 0x%02x -> firing event '%s'", cmd, token.c_str());
                id(quietcool_remote_event).trigger(token);
                // Ambient speed sensor (Issue: Climate Advisor speed-aware remote) -- an
                // explicit speed-select press is the simplest, most direct source: token
                // is already exactly "low"/"medium"/"high".
                id(quietcool_speed_sensor).publish_state(token);
                ESP_LOGD("quietcool-fan", "Speed sensor updated from speed branch: %s", token.c_str());
                // A confirmed speed byte means the fan is on (gunkl/ClimateAdvisor#1215): turns the entity on if it
                // reads off, else just keeps its speed in step.
                id(remote_hint)->execute(true, (cmd == 0x1f) ? 1 : 2, prev_speed != 0, cmd, -1);
                id(pending_speed_count) = 0;
              }
            } else if (id(pending_speed_count) > 0 && speed_age_ms <= SAME_BURST_TOLERANCE_MS) {
              // Mismatch, but still inside the same 3x burst window -- likely a corrupted copy
              // of the candidate we're already tracking (e.g. 3f, 2f, 3f: the 2f is discarded
              // here, the two 3f readings still confirm). Ignore it; do not lose progress.
              ESP_LOGD("quietcool-fan", "Speed: ignoring mismatched 0x%02x within same-burst tolerance", cmd);
            } else {
              // No candidate, or the mismatch is late enough to be a genuinely new value.
              ESP_LOGD("quietcool-fan", "Speed: new candidate 0x%02x, awaiting confirmation", cmd);
              id(pending_speed_value) = cmd;
              id(pending_speed_count) = 1;
              id(pending_speed_ms) = now_ms;
            }
            return;
          }

          // ---- TIMER field ------------------------------------------------------------------
          // Issue: LOW-speed and HIGH-speed timer presses are NOT the same byte family. The
          // remote ORs a "current speed" flag bit (0x20) into the timer status byte whenever
          // its currently-selected speed is HIGH, so the same duration is reported as 0x9_ at
          // LOW speed but 0xB_ at HIGH speed (confirmed via live capture: 0x91/0x92/0x94/0x98/
          // 0x9c at LOW became 0xB1/0xB2/0xB4/0xB8/0xBC at HIGH -- each differs by exactly
          // 0x20). The original exact-byte match only recognized the 0x9_ (LOW) family, so
          // every HIGH-speed timer press fell through entirely undecoded and no timer_Nh event
          // ever fired -- a deterministic decode gap, not RF noise/packet loss. Fixed by
          // masking off the speed-context nibble and decoding the duration from the low nibble
          // alone, so all speed contexts map to the same timer_Nh tokens. The 0xA_ (MEDIUM)
          // family is included by inference from the same 0x20-bit pattern -- it has never
          // been directly observed (this fan is 2-speed, so MEDIUM is unreachable), documented
          // here as speculative per the same project convention already used for the untested
          // 0x2F MEDIUM speed-select byte. See docs/remote-capture-protocol.md.
          uint8_t timer_family = cmd & 0xF0;   // 0x90=speed low, 0xA0=speed medium (speculative), 0xB0=speed high
          uint8_t timer_value = cmd & 0x0F;    // 1,2,4,8,0xC=12h, 0xF=none
          bool is_timer_byte = (timer_family == 0x90 || timer_family == 0xA0 || timer_family == 0xB0) &&
                                (timer_value == 0x1 || timer_value == 0x2 || timer_value == 0x4 ||
                                 timer_value == 0x8 || timer_value == 0xC || timer_value == 0xF);
          if (is_timer_byte) {
            // ==== Speed-only press, take 2 (gunkl/quietcool-house-fan#5 follow-up) ============
            // The guard below (cmd == timer_state -> heartbeat) predates speed mattering here:
            // it correctly says "this exact duration byte is already held, nothing new" for its
            // ORIGINAL purpose (firing timer_Nh). But since a no-timer byte also carries speed
            // context via the SHARED speed_state global (also written by the dedicated SPEED
            // field above), the same raw byte can legitimately recur as a genuinely NEW speed
            // selection if the effective speed drifted away and back via THAT other byte family
            // in between -- timer_state never changed (same byte), but speed_state did, then
            // reverted. Confirmed live: pressing a no-timer speed byte a second time after an
            // intervening SPEED-field press was silently dropped by the unconditional guard
            // before ever reaching the speed-firing logic below. Must be checked BEFORE the
            // early return, not inside it.
            bool is_no_timer = (timer_value == 0xF);
            uint8_t implied_speed_byte = (timer_family == 0x90) ? 0x1f : 0x2f;  // 0xB0 never reaches here -- see POWER branch above
            bool speed_is_stale = is_no_timer && (implied_speed_byte != id(speed_state));
            if (cmd == id(timer_state) && !speed_is_stale) {
              // An unchanged timer byte heard in a fresh interaction is a re-press of the same
              // timer: remote_hint re-arms the countdown (0 = "no timer" re-press cancels it).
              id(remote_hint)->execute(true, (timer_family == 0x90) ? 1 : 2, false, cmd,
                                       is_no_timer ? 0 : ((timer_value == 0xC) ? 12 : (int) timer_value));
              return;  // true heartbeat -- neither duration nor speed context has anything new
            }
            uint32_t timer_age_ms = now_ms - id(pending_timer_ms);
            if (id(pending_timer_count) > 0 && id(pending_timer_value) == cmd &&
                timer_age_ms <= CONFIRM_WINDOW_MS) {
              // Matches the in-progress candidate -- confirm.
              id(pending_timer_count) += 1;
              if (id(pending_timer_count) >= 2) {
                uint8_t prev_timer = id(timer_state);   // 0 = first confirmation since boot
                id(timer_state) = cmd;
                // Ambient speed sensor (Issue: Climate Advisor speed-aware remote) -- every
                // CONFIRMED timer-family byte also carries the current speed context in its
                // high nibble (timer_family, already computed above), regardless of whether
                // an HA timer_Nh event fires for this specific value. Update unconditionally
                // so the ambient sensor reflects reality even during a run of pure timer
                // presses with no explicit speed-select press in between.
                const char *speed_ctx = (timer_family == 0x90) ? "low" : (timer_family == 0xA0) ? "medium" : "high";
                id(quietcool_speed_sensor).publish_state(speed_ctx);
                ESP_LOGD("quietcool-fan", "Speed sensor updated from timer branch: %s", speed_ctx);
                // Any confirmed timer-family byte (0x9_/0xA_/0xB_, incl. no-timer 0x9F) means the
                // fan is on, at this speed context (gunkl/ClimateAdvisor#1215). 0xA_ (medium) is speculative; it
                // maps to HIGH since this fan only has 2 speeds.
                int timer_hours = is_no_timer ? 0 : ((timer_value == 0xC) ? 12 : (int) timer_value);
                // Captured BEFORE remote_hint moves the entity: a timer started after an off (or on a
                // fan the entity reads off) is a new start even if the duration equals the held one.
                bool was_off = !id(house_fan).state || id(remote_power) == 2;
                id(remote_hint)->execute(true, (timer_family == 0x90) ? 1 : 2, prev_timer != 0, cmd,
                                         prev_timer == 0 ? timer_hours : -1);
                std::string token;
                // Timer countdown fallback (gunkl/ClimateAdvisor#1215), only without the power-entity
                // package: a remote timer that expires transmits nothing, so remember when this one
                // should end and mirror "off" then (reconcile_loop). It follows the TIMER field:
                // a new duration arms/re-arms it, "no timer" cancels it, a speed-family-only change
                // (same duration, e.g. 0x91 -> 0xB1) and speed-field presses leave it alone, and an
                // unchanged fresh re-press re-arms it via remote_hint. The first confirmation after
                // boot (prev_timer == 0) is left to remote_hint, so a stale wake cannot arm it.
                if (!id(power_entity_present) && prev_timer != 0) {
                  if (is_no_timer) {
                    id(timer_armed) = false;
                  } else if ((prev_timer & 0x0F) != timer_value || was_off) {
                    id(timer_deadline_ms) = now_ms + (uint32_t) timer_hours * 3600000UL;
                    id(timer_armed) = true;
                  }
                }
                // The fan entity's timer preset follows a confirmed remote timer too (display only;
                // same "not the first confirmation since boot" rule, so a stale wake can't set it).
                if (prev_timer != 0) {
                  id(pending_ha_timer_hours) = 0;
                  id(timer_preset_hours) = timer_hours;
                  id(refresh_timer_preset)->execute();
                }
                if (timer_value == 0x1) token = "timer_1h";
                else if (timer_value == 0x2) token = "timer_2h";
                else if (timer_value == 0x4) token = "timer_4h";
                else if (timer_value == 0x8) token = "timer_8h";
                else if (timer_value == 0xC) token = "timer_12h";
                // A low nibble of 0xF ("no timer") has no timer_Nh token of its own -- it isn't a
                // duration to hold, it's the absence of one. Held state above still updates (once
                // confirmed) so a later real timer press correctly detects the transition back
                // into a duration.
                //
                // ==== Speed-only press (Issue gunkl/quietcool-house-fan#5) ====================
                // This is the ONLY way this remote transmits "the user selected a speed while the
                // fan was off / with no timer" -- confirmed live: pressing a speed button while
                // the fan is already ON goes through the dedicated SPEED field above (0x1F/0x3F),
                // but selecting a speed to directly turn the fan on (or while at rest) goes through
                // THIS byte family instead (0x9F/0xAF). The original design (pre-Climate Advisor
                // speed-aware remote) only ever needed the *duration* out of this byte and legitimately
                // fired nothing for the no-timer case; once Climate Advisor started needing the
                // *speed* out of it too, that silence became a real gap -- confirmed via live CA
                // logs showing every "Fan remote burst" line reading speed=None on this hardware.
                // (0xB0/HIGH's no-timer byte is 0xBF, which is intercepted by the POWER branch's
                // exact match above and never reaches here -- HIGH is unaffected by this gap.)
                // Fire it through the SAME event entity/vocabulary the SPEED field already uses,
                // edge-triggered against the SAME speed_state held-value, so a later explicit
                // speed-select press of the same value correctly sees "no change" too.
                if (!token.empty()) {
                  ESP_LOGI("quietcool-fan", "Timer: CONFIRMED 0x%02x -> firing event '%s'", cmd, token.c_str());
                  id(quietcool_remote_event).trigger(token);
                } else if (implied_speed_byte != id(speed_state)) {
                  // implied_speed_byte/speed_is_stale computed up front (see the comment at the
                  // top of this branch) -- reused here rather than re-derived, and it's what let
                  // us reach this confirm block at all when cmd == timer_state.
                  id(speed_state) = implied_speed_byte;
                  ESP_LOGI("quietcool-fan", "Timer: CONFIRMED 0x%02x (no timer) -- speed changed, firing event '%s'", cmd, speed_ctx);
                  id(quietcool_remote_event).trigger(speed_ctx);
                } else {
                  ESP_LOGI("quietcool-fan", "Timer: CONFIRMED 0x%02x (no timer, speed unchanged) -- no HA event", cmd);
                }
                id(pending_timer_count) = 0;
              }
            } else if (id(pending_timer_count) > 0 && timer_age_ms <= SAME_BURST_TOLERANCE_MS) {
              // Mismatch, but still inside the same 3x burst window -- likely a corrupted copy
              // of the candidate we're already tracking. Ignore it; do not lose progress.
              ESP_LOGD("quietcool-fan", "Timer: ignoring mismatched 0x%02x within same-burst tolerance", cmd);
            } else {
              // No candidate, or the mismatch is late enough to be a genuinely new value.
              ESP_LOGD("quietcool-fan", "Timer: new candidate 0x%02x, awaiting confirmation", cmd);
              id(pending_timer_value) = cmd;
              id(pending_timer_count) = 1;
              id(pending_timer_ms) = now_ms;
            }
            return;
          }

          // Anything else (0x50, 0x8c, 0xde, 0x43, ...) is remote status chatter that doesn't
          // belong to a known field -- intentionally not decoded (see
          // docs/remote-capture-protocol.md "de-prioritized" section). Already logged above.

script:
  - id: send_command
    mode: queued
    # One HA action can queue up to 3 codes (turn-on, speed, timer); leave room for quick follow-ups.
    max_runs: 10
    parameters:
      command: int
    then:
      - lambda: |-
          // Stamp what we're about to send (Issue #1 self-echo guard, see on_packet above).
          id(last_sent_command) = (uint8_t) command;
          id(last_sent_command_ms) = millis();
          {
            uint8_t ring_i = id(sent_cmds_idx);
            id(sent_cmds)[ring_i] = (uint8_t) command;
            id(sent_cmds_ms)[ring_i] = id(last_sent_command_ms);
            id(sent_cmds_idx) = (ring_i + 1) % 8;
          }
      - cc1101.send_packet:
          data: !lambda |-
            std::vector<uint8_t> packet(id(remote_id), id(remote_id)+4);
            packet.push_back(command);
            packet.push_back(command);
            return packet;
      - delay: 70ms
      - cc1101.send_packet:
          data: !lambda |-
            std::vector<uint8_t> packet(id(remote_id), id(remote_id)+4);
            packet.push_back(command);
            packet.push_back(command);
            return packet;
      - delay: 70ms
      - cc1101.send_packet:
          data: !lambda |-
            std::vector<uint8_t> packet(id(remote_id), id(remote_id)+4);
            packet.push_back(command);
            packet.push_back(command);
            return packet;
      - logger.log:
          format: "Sent command 0x%02x from ID [0x%02x, 0x%02x, 0x%02x, 0x%02x]"
          args:
            - command
            - id(remote_id)[0]
            - id(remote_id)[1]
            - id(remote_id)[2]
            - id(remote_id)[3]

  # Mirror a change onto the house_fan entity WITHOUT transmitting (gunkl/ClimateAdvisor#1215).
  #   power: 1 = on, 0 = off, -1 = leave on/off alone
  #   level: 1/2 = speed to adopt (only applied while the fan is on), 0 = leave speed alone
  #   record: true = this is a press-driven change, so start the power-reading lag window
  # Only on/off and the 2 real speeds are mirrored; timers are not. There is no ESPHome API that
  # updates a template fan's state silently: publish_state() runs the state callbacks, which is
  # what fires on_turn_on/on_turn_off/on_speed_set. So syncing_from_remote is raised for the
  # duration (the callbacks run synchronously inside publish_state) and the transmit steps in the
  # fan: section below are gated on it. The non-transmit housekeeping in on_turn_off (reset
  # speed to fan_default_speed) still runs, which is what we want after a remote off.
  - id: sync_fan_from_remote
    mode: single
    parameters:
      power: int
      level: int
      record: bool
    then:
      - lambda: |-
          bool changed = false;
          bool state_changed = false;
          if (power >= 0 && id(house_fan).state != (power == 1)) {
            id(house_fan).state = (power == 1);
            changed = true;
            state_changed = true;
          }
          if (level > 0 && id(house_fan).state && id(house_fan).speed != level) {
            id(house_fan).speed = level;
            changed = true;
          }
          if (!changed) return;
          if (state_changed && record) {
            id(last_event_ms) = millis();
            id(last_event_on) = id(house_fan).state;
          }
          ESP_LOGI("quietcool-fan", "Fan entity follows %s: state=%s speed=%d (no transmit)",
                   record ? "remote" : "power reading/timer", id(house_fan).state ? "on" : "off",
                   id(house_fan).speed);
          id(syncing_from_remote) = true;
          id(house_fan).publish_state();
          id(syncing_from_remote) = false;
          // The speed the fan now runs at counts as "sent": otherwise a later HA speed change back
          // to the value we last TRANSMITTED (before the remote moved it) would be swallowed by
          // on_speed_set's x != commanded_speed check. (on_turn_off already resets it to 0.)
          if (id(house_fan).state) id(commanded_speed) = id(house_fan).speed;

  # What a confirmed (or re-heard) remote byte means for the ENTITY (gunkl/ClimateAdvisor#1215).
  #   wants_on: the byte says or implies the fan is on (0xBF, a speed byte, any timer-family byte);
  #             false = the off bytes 0x80/0xB0.
  #   changed:  it reached its field's CONFIRM block with a previous held value (a real press);
  #             false = an already-held value heard again, OR the first confirmation of that field
  #             since boot (a stale status re-sent after a reboot).
  #   raw:      the received command byte (0x80 and 0xB0 are not interchangeable here).
  #   hours:    timer countdown instruction for an unchanged re-press: -1 none, 0 cancel, >0 re-arm.
  #
  # Nothing here touches the HA events or power_state/speed_state/timer_state (state (a)). It only
  # decides whether state (b), the entity, moves. Rules (cases: docs/remote-capture-protocol.md,
  # "Fan entity state follows the remote"):
  #  - CHANGED on-byte: the remote moved, so the entity goes on (or its speed follows if already on);
  #  - UNCHANGED on-byte: first it must be a fresh interaction (0x66 wake, or first packet after >3 s
  #    silence) heard twice. Then the entity moves only if it is off AND the remote had announced OFF
  #    (remote_power == 2); if the remote still holds "on" (CA stopped the fan behind its back) it is
  #    indistinguishable from a plain wake re-sending stale status, so it changes nothing. The same
  #    accepted re-press re-arms the timer countdown;
  #  - CHANGED off-byte: the entity goes off;
  #  - UNCHANGED off-byte: 0xB0 (the status beacon a wake re-sends) NEVER moves the entity. 0x80 (the
  #    action byte, sent only when Off is pressed) heard twice while the entity is on counts as an
  #    off press whatever remote_power says -- this is also how "CA on, remote held off, remote off
  #    pressed" is seen.
  # Our own transmissions are dropped before decode (sent_cmds ring), so no extra after-transmit
  # blackout is needed for learning from the remote; only the unchanged-0x80 path keeps a short one.
  - id: remote_hint
    mode: single
    parameters:
      wants_on: bool
      level: int
      changed: bool
      raw: int
      hours: int
    then:
      - lambda: |-
          static const uint32_t FRESH_WINDOW_MS = 2500;
          static const uint32_t CONFIRM_WINDOW_MS = 1500;
          static const uint32_t OWN_TX_QUIET_MS = 500;
          uint32_t now_ms = millis();
          if (wants_on) {
            if (!changed) {
              if (id(fresh_ms) == 0 || (now_ms - id(fresh_ms)) > FRESH_WINDOW_MS) return;
              if (id(implied_on_count) > 0 && (now_ms - id(implied_on_ms)) <= CONFIRM_WINDOW_MS) {
                id(implied_on_count) += 1;
              } else {
                id(implied_on_count) = 1;
                id(implied_on_ms) = now_ms;
              }
              if (id(implied_on_count) < 2) return;
              id(implied_on_count) = 0;
              // Only a remote that ANNOUNCED off (remote_power == 2) can have been re-pressed: 0 (never
              // seen, e.g. the first boot after flashing) and 1 (still holds "on") both look exactly
              // like a plain wake re-sending stale status.
              bool turns_on = !id(house_fan).state && id(remote_power) == 2;
              // An accepted fresh re-press of a timer re-arms the countdown (and "no timer" cancels
              // it) -- but a re-arm needs a countdown already running or this very call turning the
              // fan on; otherwise a stale wake re-sending e.g. 0x91 after the timer expired and CA
              // restarted the fan would arm a countdown that switches the entity off an hour later.
              if (!id(power_entity_present) && hours >= 0) {
                if (hours == 0) {
                  id(timer_armed) = false;
                } else if (id(timer_armed) || turns_on) {
                  id(timer_deadline_ms) = now_ms + (uint32_t) hours * 3600000UL;
                  id(timer_armed) = true;
                }
              }
              if (!turns_on) return;
              ESP_LOGI("quietcool-fan", "Remote re-press after an announced off implies power ON (level=%d)", level);
            }
            id(remote_power) = 1;
            id(implied_off_count) = 0;
            if (id(house_fan).state) {
              if (changed) id(sync_fan_from_remote)->execute(-1, level, false);
            } else {
              id(sync_fan_from_remote)->execute(1, level, true);
            }
          } else {
            if (!changed) {
              // 0xB0 (the status beacon a plain wake re-sends) never moves the entity ON ITS OWN. 0x80
              // (the action byte, sent only when Off is pressed) needs two readings -- but its first
              // copy is often corrupted, so one 0x80 followed by a 0xB0 within the same-burst
              // tolerance also counts (an off press is announced as 0x80 then the 0xB0 status).
              static const uint32_t SAME_BURST_TOLERANCE_MS = 400;
              bool off_status = (raw == 0xB0) || (id(code_off_status_low) != 0 && raw == id(code_off_status_low));
              if (raw != 0x80 && !off_status) return;
              if (!id(house_fan).state) return;
              if (id(last_sent_command_ms) != 0 && (now_ms - id(last_sent_command_ms)) < OWN_TX_QUIET_MS) return;
              if (off_status) {
                if (!(id(implied_off_count) == 1 && (now_ms - id(implied_off_ms)) <= SAME_BURST_TOLERANCE_MS)) return;
                id(implied_off_count) = 2;
              } else if (id(implied_off_count) > 0 && (now_ms - id(implied_off_ms)) <= CONFIRM_WINDOW_MS) {
                id(implied_off_count) += 1;
              } else {
                id(implied_off_count) = 1;
                id(implied_off_ms) = now_ms;
              }
              if (id(implied_off_count) < 2) return;
              ESP_LOGI("quietcool-fan", "Remote off action (0x80) confirmed again while the entity is on");
            }
            id(implied_off_count) = 0;
            id(implied_on_count) = 0;
            id(remote_power) = 2;
            id(timer_armed) = false;
            id(sync_fan_from_remote)->execute(0, 0, true);
          }

  # Called by the optional power-entity package (power-entity.yaml).
  - id: power_reading_update
    mode: single
    parameters:
      state: std::string
    then:
      - lambda: |-
          uint8_t v = (state == "on") ? 1 : (state == "off") ? 2 : 0;   // unavailable/unknown -> ignored
          if (v == 0) {
            // Unavailable/unknown: stop trusting the reading, but remember the last real value so a
            // return to the SAME value is not mistaken for a change (it would win the spin-up hold).
            if (id(power_reading) != 0) ESP_LOGI("quietcool-fan", "Power reading unavailable (%s) -- ignored", state.c_str());
            id(power_reading) = 0;
          } else {
            if (v != id(power_reading_last)) {
              id(power_reading_ms) = millis();
              id(power_reading_last) = v;
              ESP_LOGI("quietcool-fan", "Power reading: %s", state.c_str());
            }
            id(power_reading) = v;
          }

  # Once per second, started from on_boot (a looping script rather than an interval: block, so the
  # paste-in install does not gain a top-level key that may collide with your own).
  #  - WITH the power-entity package: reconcile the entity with the power reading (see below).
  #  - WITHOUT it: mirror "off" when a remote timer's countdown has elapsed.
  # Reading-vs-entity rule (it lags a real change by up to ~14 s on / ~15.5 s off):
  #  - disagreement inside the lag window after the last remote press / our own transmission: the
  #    event wins, the reading is ignored;
  #  - after the window the reading wins. After an ON event it must also have CHANGED since that
  #    event (a slow spin-up still reading "off" must never flip an entity the user just turned on),
  #    or power_hard_timeout_s must have passed. After an OFF event it wins as soon as the window is
  #    over (a lost RF off must not leave the entity stuck "off" and swallow CA's retries);
  #  - with no event at all (timer ran out, wall switch, power cut, boot) the reading wins once it
  #    has held ~2 s;
  #  - "unavailable"/"unknown" readings are ignored (power_reading 0), and nothing is reconciled while
  #    the API is disconnected: the text sensor does not clear itself on disconnect, so its last value
  #    would otherwise be trusted indefinitely.
  - id: reconcile_loop
    mode: single
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - lambda: |-
                uint32_t now_ms = millis();
                // A timer picked in HA while the fan was off is only held this long for a turn-on.
                static const uint32_t HA_TIMER_HOLD_MS = 30000;
                if (id(pending_ha_timer_hours) != 0 && (now_ms - id(pending_ha_timer_ms)) > HA_TIMER_HOLD_MS) {
                  ESP_LOGI("quietcool-fan", "Timer %dh picked while the fan was off: no turn-on within 30 s -- cleared",
                           id(pending_ha_timer_hours));
                  id(pending_ha_timer_hours) = 0;
                  if (!id(house_fan).state) {
                    id(timer_preset_hours) = 0;
                    id(refresh_timer_preset)->execute();
                  }
                }
                if (!id(power_entity_present)) {
                  if (id(timer_armed) && (int32_t) (now_ms - id(timer_deadline_ms)) >= 0) {
                    id(timer_armed) = false;
                    ESP_LOGI("quietcool-fan", "Remote timer countdown elapsed -- fan entity off (no transmit)");
                    id(remote_power) = 2;
                    id(sync_fan_from_remote)->execute(0, 0, false);
                  }
                  return;
                }
                #ifdef USE_API
                // with_state_subscription: a log-viewer-only client is not Home Assistant.
                if (!api::global_api_server->is_connected_with_state_subscription()) return;
                #endif
                static const uint32_t STABLE_MS = 2000;
                uint8_t reading = id(power_reading);
                if (reading == 0) return;
                bool want_on = (reading == 1);
                if (id(house_fan).state == want_on) return;
                if ((now_ms - id(power_reading_ms)) < STABLE_MS) return;
                if (id(last_event_ms) != 0) {
                  uint32_t lag_ms = (id(last_event_on) ? (uint32_t) ${power_on_lag_s} : (uint32_t) ${power_off_lag_s}) * 1000UL;
                  uint32_t since_event_ms = now_ms - id(last_event_ms);
                  if (since_event_ms < lag_ms) return;   // inside the lag window: the event wins
                  bool reading_changed_since_event = (int32_t) (id(power_reading_ms) - id(last_event_ms)) > 0;
                  // The "reading must change, or power_hard_timeout_s passes" hold applies ONLY after an
                  // ON event (a slow spin-up still reads off). After an OFF event the reading wins as
                  // soon as the off lag window is over: if CA's RF off was lost the fan keeps running
                  // in a sealed house, and holding the entity "off" would swallow every CA retry.
                  if (id(last_event_on) && !reading_changed_since_event &&
                      since_event_ms < (uint32_t) ${power_hard_timeout_s} * 1000UL) return;
                }
                ESP_LOGW("quietcool-fan", "Power reading (%s) disagrees with fan entity (%s) outside the lag window -- following the reading (no transmit)",
                         want_on ? "on" : "off", id(house_fan).state ? "on" : "off");
                id(sync_fan_from_remote)->execute(want_on ? 1 : 0, 0, false);
            - delay: 1s

  # The one place a fan speed level is turned into its RF speed-select byte (Issue #10).
  - id: send_speed
    mode: queued
    parameters:
      level: int
    then:
      - lambda: |-
          id(note_commanded_speed)->execute(level);
          id(send_command)->execute(level >= 2 ? id(code_speed_high) : id(code_speed_low));

  # Record a speed THIS device commanded: on_speed_set's duplicate check (commanded_speed), and
  # the QuietCool Speed sensor, so it shows the fan's speed whichever side set it. The intended
  # speed is published, not decoded from each byte sent (a glass turn-on sends 0xBF, which alone
  # would read as "high", before the LOW byte). What the REMOTE last announced (speed_state) is
  # left alone: the remote never hears us.
  - id: note_commanded_speed
    mode: queued
    parameters:
      level: int
    then:
      - lambda: |-
          id(commanded_speed) = level >= 2 ? 2 : 1;
          id(quietcool_speed_sensor).publish_state(level >= 2 ? "high" : "low");

  # A timer preset picked in Home Assistant (on_preset_set). hours: 1/2/4/8/12, 0 = "No timer".
  #  - Fan on: send it now, at the fan's current speed (send_timer).
  #  - Fan off: send nothing (a timer code would start the fan). Hold it for 30 s; the next
  #    turn-on from HA sends it right after the turn-on (on_turn_on). Otherwise it is cleared
  #    (reconcile_loop).
  #  - "No timer": the fan has no cancel command, so nothing is sent. It only clears the preset
  #    shown and any held timer; turning the fan off ends a running timer.
  - id: ha_set_timer
    mode: queued
    parameters:
      hours: int
    then:
      - lambda: |-
          if (!id(booted_up)) return;
          if (hours <= 0) {
            id(pending_ha_timer_hours) = 0;
            id(timer_preset_hours) = 0;
            id(refresh_timer_preset)->execute();
            return;
          }
          if (hours != 1 && hours != 2 && hours != 4 && hours != 8 && hours != 12) {
            ESP_LOGW("quietcool-fan", "Unsupported timer %dh ignored", hours);
            id(refresh_timer_preset)->execute();
            return;
          }
          if (!id(house_fan).state) {
            ESP_LOGI("quietcool-fan", "Timer %dh picked while the fan is off -- held 30 s for a turn-on", hours);
            id(pending_ha_timer_hours) = hours;
            id(pending_ha_timer_ms) = millis();
            id(timer_preset_hours) = hours;
            id(refresh_timer_preset)->execute();
            return;
          }
          id(send_timer)->execute(hours);

  # Transmit a timer (the fan must already be on) at the fan's current speed, exactly the code the
  # remote's timer button sends. The fan counts down on its own. Then:
  #  - fire the SAME event-entity tokens a remote timer press produces (timer_Nh, then the speed), so
  #    Climate Advisor sees an HA-set timer through its existing remote-event handling;
  #  - start the existing remote-timer countdown (only without the power-entity package), so the
  #    fan entity goes off when the fan's timer ends;
  #  - show it as the fan entity's preset.
  - id: send_timer
    mode: queued
    parameters:
      hours: int
    then:
      - lambda: |-
          int level = id(house_fan).speed >= 2 ? 2 : 1;
          int idx = (hours == 1) ? 0 : (hours == 2) ? 1 : (hours == 4) ? 2 : (hours == 8) ? 3 : 4;
          uint8_t code = (level >= 2) ? id(codes_timer_high)[idx] : id(codes_timer_low)[idx];
          ESP_LOGI("quietcool-fan", "Timer %dh from HA at %s speed -> 0x%02x", hours, level >= 2 ? "HIGH" : "LOW", code);
          id(send_command)->execute(code);
          id(note_commanded_speed)->execute(level);
          id(pending_ha_timer_hours) = 0;
          if (!id(power_entity_present)) {
            id(timer_deadline_ms) = millis() + (uint32_t) hours * 3600000UL;
            id(timer_armed) = true;
          }
          id(timer_preset_hours) = hours;
          id(refresh_timer_preset)->execute();
          id(quietcool_remote_event).trigger("timer_" + std::to_string(hours) + "h");
          id(quietcool_remote_event).trigger(level >= 2 ? "high" : "low");

  # Make the fan entity's preset show timer_preset_hours. Deferred by one loop (delay 0) so it never
  # runs inside the fan's own state update, and raised under syncing_from_remote so on_preset_set
  # ignores it. Called when the timer changes, and after a speed change (HA clears a fan's preset
  # whenever the speed is set, but the fan keeps its timer).
  - id: refresh_timer_preset
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          int h = id(timer_preset_hours);
          const char *want = (h == 1) ? "1h" : (h == 2) ? "2h" : (h == 4) ? "4h" : (h == 8) ? "8h" :
                             (h == 12) ? "12h" : "No timer";
          if (id(house_fan).get_preset_mode() == want) return;
          id(syncing_from_remote) = true;
          auto call = id(house_fan).make_call();
          call.set_preset_mode(want);
          call.perform();
          id(syncing_from_remote) = false;

fan:
  - platform: template
    name: "quietcool whole house fan"
    id: house_fan
    speed_count: 2
    restore_mode: RESTORE_DEFAULT_OFF
    # Timer presets: pick the fan's own timer from the standard fan controls (more-info dialog, or a
    # Tile card with the "Fan preset modes" feature). See ha_set_timer in the script section: with
    # the fan on it is sent right away at the current speed; with the fan off it is held 30 s for a
    # turn-on from HA. The fan counts down itself; this device never reports time remaining (see
    # docs/ha-timer-countdown.md for a Home Assistant countdown). "No timer" sends nothing.
    preset_modes:
      - "No timer"
      - "1h"
      - "2h"
      - "4h"
      - "8h"
      - "12h"
    on_preset_set:
      # Skips our own preset updates (refresh_timer_preset), the boot-time restore, and the empty
      # preset HA leaves after any speed change.
      - if:
          condition:
            lambda: 'return id(booted_up) && !id(syncing_from_remote) && !x.empty();'
          then:
            - script.execute:
                id: ha_set_timer
                hours: !lambda |-
                  return x == "1h" ? 1 : x == "2h" ? 2 : x == "4h" ? 4 : x == "8h" ? 8 : x == "12h" ? 12 : 0;
    # Every transmit below is gated on id(booted_up) (see the boot guard at the top of this file)
    # so that RESTORE_DEFAULT_OFF's boot-time state replay updates the entity's reported state
    # without re-commanding the physical fan. Only genuine post-boot triggers actually transmit.
    #
    # Default speed vs. an explicitly chosen speed (Issues #9, #10). ESPHome's fan core
    # (FanCall::validate_) turns a plain "turn on" into "turn on at 100%" whenever the entity's
    # speed field is 0. Earlier versions of this file zeroed speed on every turn-off, and then
    # forced speed = 1 inside on_turn_on. That made a plain turn-on and an explicit
    # "turn on at HIGH" look identical (both speed=2), and the on_turn_on override then turned
    # BOTH into LOW. That was the HA-card bug in #10: from OFF, pick HIGH -> the UI briefly shows
    # HIGH -> the device transmits 0xbf + 0x1f -> the UI and the fan drop to LOW.
    #
    # Now, while OFF, the speed field holds fan_default_speed instead of 0 (set in on_turn_off
    # and re-applied at boot). So a plain turn-on keeps that default, and an explicit speed
    # replaces it. on_turn_on never overwrites the requested speed. It transmits power-on and
    # then the actual target speed (the hardware's own power-on default is HIGH, so the speed
    # is always sent explicitly). on_speed_set handles changes while already on.
    # Side effect: HA's percentage attribute reads the default (e.g. 50%) while the fan is
    # off instead of 0%. The on/off state itself is unaffected.
    #
    # Remote-driven state (gunkl/ClimateAdvisor#1215, gunkl/ClimateAdvisor#449): a confirmed remote start/stop is mirrored onto this
    # entity by sync_fan_from_remote (script section above) so a later HA turn_off is a real
    # on->off edge and transmits. That mirroring raises syncing_from_remote, which every transmit
    # below also checks -- mirroring the remote must never transmit back at it. Our own
    # transmissions deliberately do NOT touch power_state/speed_state/timer_state (what the REMOTE
    # last announced; it never hears us). They only start the power-reading lag window and cancel
    # any timer countdown.
    #
    # Turn-on codes depend on remote_type (see substitutions). glass: 0xBF, then the speed byte.
    # legacy: one byte that starts the fan at the wanted speed (0x9F LOW / 0xBF HIGH).
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(booted_up) && !id(syncing_from_remote);'
          then:
            - lambda: |-
                int level = id(house_fan).speed >= 2 ? 2 : 1;
                id(send_command)->execute(level >= 2 ? id(code_turn_on_high) : id(code_turn_on_low));
                if (id(turn_on_sends_speed)) {
                  id(send_speed)->execute(level);
                } else {
                  id(note_commanded_speed)->execute(level);
                }
                id(last_event_ms) = millis();
                id(last_event_on) = true;
                id(timer_armed) = false;
                // A timer picked while the fan was off (ha_set_timer) goes out now, at this speed.
                if (id(pending_ha_timer_hours) != 0) {
                  int hours = id(pending_ha_timer_hours);
                  id(pending_ha_timer_hours) = 0;
                  if ((millis() - id(pending_ha_timer_ms)) <= 30000UL) {
                    id(send_timer)->execute(hours);
                  }
                }
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(booted_up) && !id(syncing_from_remote);'
          then:
            - script.execute:
                id: send_command
                command: !lambda 'return id(code_off);'
            - lambda: |-
                id(last_event_ms) = millis();
                id(last_event_on) = false;
                id(timer_armed) = false;
      - lambda: |-
          id(commanded_speed) = 0;
          id(house_fan).speed = ${fan_default_speed};
          // Off by any means (HA, remote, power reading, timer end) ends the fan's timer.
          id(timer_preset_hours) = 0;
          id(refresh_timer_preset)->execute();
    on_speed_set:
      # Only while on (a speed change while off, including on_turn_off's own reset to the
      # default above, must never transmit), and only if on_turn_on didn't already send it.
      - if:
          condition:
            lambda: 'return id(booted_up) && !id(syncing_from_remote) && id(house_fan).state && x != id(commanded_speed);'
          then:
            - script.execute:
                id: send_speed
                level: !lambda 'return x;'
      # HA clears a fan's preset on every speed change; the fan keeps its timer, so show it again.
      - lambda: 'if (id(house_fan).state) id(refresh_timer_preset)->execute();'

####################################################################################################
# Remote-receive support (Issue #1): exposes decoded remote button presses to Home Assistant.
# The on_packet handler above fires this event with one of the event_types below only when a
# field's reported value changes from what was previously held (edge-triggered) -- the remote
# re-announces its full status every few seconds after any interaction, and those repeats are
# intentionally absorbed, not fired again. "medium" speed is untested (this fan is 2-speed) but
# documented as if it functioned, per project decision -- see docs/remote-capture-protocol.md.
####################################################################################################
event:
  - platform: template
    name: "QuietCool Remote"
    id: quietcool_remote_event
    device_class: button
    event_types:
      - "on"
      - "off"
      - "low"
      - "medium"
      - "high"
      - "timer_1h"
      - "timer_2h"
      - "timer_4h"
      - "timer_8h"
      - "timer_12h"

####################################################################################################
# Ambient current-speed sensor (Climate Advisor speed-aware remote integration): reports the
# firmware's already-internally-tracked current speed as a continuously-readable STATE, distinct
# from the event entity above (which reports discrete PRESSES). Fed from all three status-beacon
# byte families that carry the embedded speed-context bit (see on_packet's SPEED/TIMER/POWER
# branches) so it reflects reality even in a session with no explicit speed-select press --
# e.g. a run of pure timer presses, or a plain on/off with no speed button touched at all.
# Purely additive: zero change to the event entity's existing schema/semantics above.
####################################################################################################
text_sensor:
  - platform: template
    name: "QuietCool Speed"
    id: quietcool_speed_sensor
    icon: "mdi:fan"
